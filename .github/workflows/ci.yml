name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      # Public, synthetic build-only key. CI never signs in or accesses a library.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and enforce feature boundaries
        run: pnpm lint

      - name: Check source formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test:run

      - name: Check types
        run: pnpm typecheck

      - name: Test shared Expo UI
        run: pnpm test:mobile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test media evidence boundary
        run: python -m unittest discover -s services/media -p 'test_*.py'

      - name: Build application
        run: pnpm build

      - name: Check built web routing
        run: pnpm test:web
